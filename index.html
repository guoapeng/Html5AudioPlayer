<!doctype html>
<html class="imageBg">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
        <meta name="description" content="a collection of songs that I love, also shows how to sync lyric with HTML5 audio tag">
        <meta name="author" content="Wayou">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>精選 | a collection of songs that I love, also shows how to sync lyric with HTML5 audio tag</title>
        <link rel="stylesheet" href="styles/style.css">
        <link rel="stylesheet" href="styles/player.css">
        <link rel="stylesheet" href="styles/small.css">
    </head>
    <body>
        <header>
            <h1> <a href="https://github.com/guoapeng/Html5AudioPlayer/" target="_blank" title="view on GitHub">精選</a></h1><sub>a collection of songs that I love</sub>
        </header>
        <div class="wrapper">
            <div id="playlist">
                <ol>
                </ol>
                <div class="info">
                    <div class="bg" id="bg_dark" title="use color for background" onclick="changeBg('colorBg')"></div>
                    <div class="bg" id="bg_pic" title="use image for background" onclick="changeBg('imageBg')"></div>
                    <small> view on <a target="_blank" href="https://github.com/guoapeng/Html5AudioPlayer/">GitHub</a></small>
                </div>
            </div>
            <div id="lyricWrapper">
                <div id="lyricContainer">
                </div>
            </div>
        </div>
        <div class="footer">
            <div class="cp-container">
                <div class="con-btn">
                    <a href="javascript:;" class="player-btn btn-prev" title="上一首"></a>
                    <a href="javascript:;" class="player-btn btn-play" title="暂停/继续"></a>
                    <a href="javascript:;" class="player-btn btn-next" title="下一首"></a>
                    <a href="javascript:;" class="player-btn btn-order" title="循环控制"></a>
                </div>
                <!--class="con-btn"-->
    
                <div class="vol">
                    <div class="quiet">
                        <a href="javascript:;" class="player-btn btn-quiet" title="静音"></a>
                    </div>
                    <div class="volume">
                        <div class="volume-box">
                            <div id="volume-progress" class="mkpgb-area"></div>
                        </div>
                    </div>
                </div>
                <!--class="footer"-->
    
                <div class="progress">
                    <div class="progress-box">
                        <div id="music-progress" class="mkpgb-area"></div>
                    </div>
                </div>
                <!--class="progress"-->
            </div>
            <!--class="container"-->
        </div>
        <script src="scripts/lib/jquery.min.js"></script>
        <script src="scripts/subtitlemanager.js"></script>
        <script src="scripts/playlist.js"></script>
        <script src="scripts/audioplayer.js"></script>
        <script src="index.js"></script>
    </body>
</html>
